# fly.io configuration for the Alloyra CALPHAD service (second app,
# separate from the static web host). Stateless: databases bake into the
# image, so machines can suspend/replace freely.

app = 'alloyra-calphad'
primary_region = 'yyz'

# Model compilation for a real assessed TDB (mc_fe: 53 active phases for a
# stainless composition) peaks near 1 GB by itself; swap is the OOM
# backstop, not the working set.
swap_size_mb = 2048

[build]
  dockerfile = 'Dockerfile'

[env]
  CALPHAD_CORS_ORIGINS = 'https://alloyra.fly.dev,http://localhost:3000,http://127.0.0.1:3000'

[http_service]
  internal_port = 8791
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Equilibrium calls are CPU- and memory-bound (compiled-model cache in
  # main.py keeps repeats cheap, but cold systems compile ~1 GB); keep
  # concurrency tight.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 4

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

# Sized for professional assessed databases (ground rule 4): the 1 GB /
# 1-vCPU machine OOM-killed on the first mc_fe equilibrium. Suspend-on-idle
# keeps the larger machine cheap and preserves the warm model cache.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
