server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fly terminates TLS in front of this, so a redirect built from the
    # connection's scheme would send clients back to http.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # Next fingerprints everything under /_next/static, so those are safe
    # to pin forever; the route HTML must not be, or a deploy never
    # reaches a warm client.
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Directory-style routes from the static export (trailingSlash):
    # /studio -> /studio/ -> studio/index.html. Unknown paths get the
    # exported 404 page WITH a 404 status — this is a multi-page export,
    # not an SPA shell.
    error_page 404 /404.html;

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
