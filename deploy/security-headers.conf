# nginx's add_header does not inherit into a block that declares its own, so
# these are included per-location rather than set once on the server.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# connect-src: Alloyra's only fetch targets are the hosted CALPHAD service
# (alloyra-calphad.fly.dev) and, for development, a local bridge on
# loopback (browsers exempt loopback from mixed-content blocking on https
# pages). A different service origin must be added here AND baked in via
# NEXT_PUBLIC_CALPHAD_URL at build time.
#
# script-src/style-src need 'unsafe-inline': Next's static export bootstraps
# with inline scripts, and React inline style attributes (score bars, phase
# bars) are inline styles. Fonts are self-hosted by next/font under
# /_next/static, so no font host appears.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://alloyra-calphad.fly.dev http://127.0.0.1:8791 http://localhost:8791; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
