# nginx's add_header does not inherit into a block that declares its own, so
# these are included per-location rather than set once on the server.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# connect-src: 'self' only. All computation is the in-browser engine; its
# TDB downloads are same-origin (/tdb/). The former hosted CALPHAD bridge
# is retired — no external fetch target exists, so none is allowed.
#
# script-src/style-src need 'unsafe-inline': Next's static export bootstraps
# with inline scripts, and React inline style attributes (score bars, phase
# bars) are inline styles. Fonts are self-hosted by next/font under
# /_next/static, so no font host appears.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
